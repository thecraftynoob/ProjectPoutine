name: ccaas

# Infra-only compose file. Application services are run individually via
# `go run ./services/{name}/cmd` during local development, or deployed to
# the ccaas-dev Kubernetes namespace (see /deploy/k8s) — they are
# intentionally NOT defined here.

services:
  postgres:
    image: postgres:16
    container_name: ccaas-postgres
    restart: unless-stopped
    environment:
      # POSTGRES_USER/POSTGRES_PASSWORD provision the Postgres SUPERUSER
      # ("ccaas") -- the official postgres:16 image always creates its
      # POSTGRES_USER as a superuser, that's simply how the image's
      # bootstrap works. Every service's Migrate() connects as this role
      # at startup ONLY, to run schema migrations and idempotently
      # provision/grant a second, non-superuser runtime role
      # (POSTGRES_RUNTIME_USER below) -- never for ongoing queries.
      #
      # There is deliberately no POSTGRES_RUNTIME_PASSWORD/
      # POSTGRES_RUNTIME_USER entry in THIS environment block: unlike
      # POSTGRES_USER (which this image's own bootstrap logic consumes to
      # create the initial superuser), the runtime role is application-
      # level state created by each service's own Migrate() the first
      # time any service starts against a fresh database (see e.g.
      # services/tenant-identity/internal/pgstore/runtime_role.go) --
      # nothing in this postgres container's own startup needs to know
      # about it. Services read POSTGRES_RUNTIME_USER/
      # POSTGRES_RUNTIME_PASSWORD from .env.local (see
      # .env.local.example) to compose RUNTIME_POSTGRES_DSN, matching the
      # password Migrate() provisions the role with -- see
      # services/*/internal/pgstore/runtime_role.go's
      # defaultRuntimeRolePassword fallback for what these must agree on
      # if .env.local doesn't set POSTGRES_RUNTIME_PASSWORD explicitly.
      POSTGRES_USER: ${POSTGRES_USER:-ccaas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ccaas_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ccaas}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ccaas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: ccaas-redis
    restart: unless-stopped
    # notify-keyspace-events Ex enables Redis keyspace notifications for
    # key-expiry ("Ex" = generic expired-event notifications), required by
    # Task Router's Reservation-expiry mechanism (spec Section 4.3): each
    # Offered reservation is stored under a TTL-bearing sentinel key, and
    # Task Router subscribes to "__keyevent@<db>__:expired" to resolve it
    # atomically when the TTL fires (see
    # services/task-router/internal/redisdomain/expiry.go and the service
    # README). Safe to enable platform-wide -- notifications are a Redis
    # server-level pub/sub feature with negligible overhead, and no other
    # service in this repo relies on keys NOT emitting expiry events.
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    container_name: ccaas-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"   # client connections
      - "8222:8222"   # HTTP monitoring
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  nats_data:
