syntax = "proto3";

package tenantidentity.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/thecraftynoob/ProjectPoutine/pkg/genproto/tenant-identity/v1;tenantidentityv1";

// Tenant & Identity Management (architecture doc Section 2.2) is
// intentionally the most upstream service: CRUD for tenant registration,
// user/agent identity, simple RBAC role tags, and short-lived JWT issuance
// consumed by every other service. This pass is core identity + JWT
// issuance only -- see services/tenant-identity/README.md for what's
// explicitly out of scope (business-hours/feature-flag tenant config, full
// OAuth2/OIDC authorization-code flow, MFA, password reset, external IdP
// federation).
//
// NOTE ON TENANT SCOPING: every other service in this repo keeps tenant_id
// OUT of message fields entirely, since it always travels as gRPC metadata
// (x-tenant-id) validated by pkg/tenantctx before a handler ever runs (see
// task_router.proto's note). Tenant & Identity Management is a deliberate,
// narrow exception for exactly the RPCs that are how a caller FIRST obtains
// a tenant_id or a token -- there is no metadata to validate yet, because
// establishing that context is the RPC's entire job:
//   - CreateTenant / GetTenant / ListTenants: there is no tenant yet (or,
//     for Get/List, this is platform-registry data, not tenant-owned data)
//     -- these are platform-admin-ish operations over the tenant registry
//     itself, not data scoped BY a tenant_id.
//   - Login: the caller has a username/password and a tenant_id they
//     already know out-of-band (e.g. from their organization's login page
//     configuration), but no JWT yet -- that's what this call produces.
//     tenant_id is necessarily an explicit request field here.
//   - CreateUser: also takes tenant_id as an explicit field rather than
//     relying on metadata. This is a deliberate bootstrapping-friendly
//     choice: the very first user in a brand new tenant cannot yet present
//     a token (there IS no admin token until an admin user exists to log
//     in), so CreateUser must be reachable with only a tenant_id in hand,
//     the same way CreateTenant is reachable with nothing in hand. In a
//     later milestone, once pkg/tenantctx is wired to real JWT validation,
//     a production deployment would put an authorization check inside the
//     handler (e.g. require an authenticated admin-role caller whose OWN
//     tid claim matches the target tenant_id) rather than relying on
//     transport-level tenant-context middleware -- that's a handler-level
//     concern, not a routing concern, precisely because this RPC's
//     tenant_id is caller-asserted input, not middleware-derived context.
//   - GetUser / ListUsers: by contrast, these operate WITHIN an
//     already-established tenant context (an admin who already has a
//     valid JWT for that tenant looking up users in it), so they take NO
//     tenant_id field and rely on x-tenant-id metadata like every other
//     service's steady-state RPCs.
//
// TENANTCTX EXEMPTION: CreateTenant, GetTenant, ListTenants, CreateUser,
// Login, and IssueServiceToken are exempt from pkg/tenantctx's interceptor
// (see services/tenant-identity/cmd/main.go's exemption list) -- each is
// reachable with no established tenant context, by design (see above, and
// see IssueServiceToken's own doc comment for why it joins this list).
// GetUser and ListUsers are NOT exempt: they operate within an already-
// established tenant context exactly like every other service's
// steady-state RPCs, so they go through the same verified-JWT interceptor
// as Task Router's/Agent Presence's RPCs and require a valid bearer token
// on the call.
service TenantService {
  // CreateTenant registers a brand new tenant in the platform registry.
  // This is how a caller obtains a real tenant_id in the first place --
  // there is no tenant context to require yet.
  rpc CreateTenant(CreateTenantRequest) returns (Tenant) {
    option (google.api.http) = {
      post: "/v1/tenants"
      body: "*"
    };
  }

  // GetTenant retrieves one tenant's registry record by id.
  rpc GetTenant(GetTenantRequest) returns (Tenant) {
    option (google.api.http) = {
      get: "/v1/tenants/{tenant_id}"
    };
  }

  // ListTenants enumerates every registered tenant. Platform-admin-ish;
  // not scoped by any single tenant_id since it operates across the
  // registry itself.
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse) {
    option (google.api.http) = {
      get: "/v1/tenants"
    };
  }
}

// IdentityService is the user/agent identity, RBAC, and authentication
// domain: bootstrapping users within a tenant and issuing short-lived JWTs
// via password login.
service IdentityService {
  // CreateUser provisions a new user/agent identity record within a
  // tenant. Takes tenant_id as an explicit field (see the file-level note
  // above for why) rather than relying on gRPC metadata -- this is
  // deliberately reachable before any token exists for that tenant.
  rpc CreateUser(CreateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/tenants/{tenant_id}/users"
      body: "*"
    };
  }

  // Login verifies username+password within the given tenant and, on
  // success, mints a short-lived JWT carrying the `tid` (tenant_id),
  // `sub` (user id), and `roles` claims (architecture doc Section 1.1
  // Layer 1's future JWT-consumer contract). tenant_id is an explicit
  // field since the caller has no token yet -- this call is how one is
  // obtained.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }

  // GetUser retrieves one user's identity record within the caller's
  // already-established tenant context (x-tenant-id metadata).
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}"
    };
  }

  // ListUsers enumerates every user within the caller's tenant context
  // (x-tenant-id metadata).
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/v1/users"
    };
  }

  // IssueServiceToken mints a short-lived JWT for SERVICE-to-service calls
  // (as opposed to Login's end-user, username+password path). This is
  // explicitly a narrow, minimally-scoped mechanism -- NOT a hardened
  // zero-trust/mTLS service mesh (that is a separate, larger
  // infrastructure milestone; see CCAAS_ENTERPRISE_ARCHITECTURE.md
  // Section 1.1 Layer 2's "separately authenticated via mTLS + a distinct
  // admin scope" language, which this deliberately does NOT attempt to
  // fully satisfy yet). Authentication here is a single shared credential
  // (see shared_secret below) every service reads from the same
  // Kubernetes Secret -- "good enough to retire the blind-trust
  // placeholder and establish the real bearer-token pattern," not a
  // hardened per-service identity scheme.
  //
  // The caller supplies the tenant it wants to act within (a service
  // calling another service is always doing so on behalf of some
  // tenant-scoped operation -- there is no "no tenant" service call in
  // this system) plus the shared secret. On success, returns a JWT shaped
  // identically to Login's (same `tid`/`sub`/`roles` claim set consumed by
  // pkg/tenantctx and pkg/jwtauth) so the verifying interceptor never
  // needs to distinguish "user-originated" from "service-originated"
  // calls -- both are just valid JWTs. The `sub` claim is set to
  // "service:<caller_name>" and `roles` includes "service" so a future
  // audit/authorization decision CAN distinguish service tokens from user
  // tokens if ever needed, without requiring it to today.
  //
  // Exempt from pkg/tenantctx's interceptor (see TENANTCTX EXEMPTION note
  // above): this is itself how a caller obtains a token, so it cannot
  // require one to already exist.
  rpc IssueServiceToken(IssueServiceTokenRequest) returns (IssueServiceTokenResponse);
}

// Tenant mirrors the tenants registry table: id, name, created_at. Not
// itself tenant-scoped data (it IS the tenant registry) -- see
// pgstore/migrations for why no RLS applies to this table.
message Tenant {
  string tenant_id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
}

message CreateTenantRequest {
  string name = 1;
}

message GetTenantRequest {
  string tenant_id = 1;
}

message ListTenantsRequest {}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
}

// User mirrors one tenant-scoped identity record: username, roles (a
// simple set of string tags -- not a policy engine), created_at. Never
// carries the password hash outward.
message User {
  string user_id = 1;
  string tenant_id = 2;
  string username = 3;
  repeated string roles = 4;
  google.protobuf.Timestamp created_at = 5;
}

message CreateUserRequest {
  // Explicit field -- see file-level note on why CreateUser doesn't rely
  // on x-tenant-id metadata.
  string tenant_id = 1;
  string username = 2;
  string password = 3;
  repeated string roles = 4;
}

message LoginRequest {
  // Explicit field -- the caller has no token yet; this call is how one
  // is obtained.
  string tenant_id = 1;
  string username = 2;
  string password = 3;
}

message LoginResponse {
  // Signed, short-lived JWT (RS256/ES256; see internal/authn) carrying
  // `tid`, `sub`, and `roles` claims, shaped for pkg/jwtauth.Verifier and
  // pkg/tenantctx's eventual future consumption.
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message GetUserRequest {
  string user_id = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message IssueServiceTokenRequest {
  // The tenant the resulting token should be scoped to (`tid` claim). A
  // service call always acts within some tenant-scoped operation, so this
  // is always required -- there is no cross-tenant service token.
  string tenant_id = 1;
  // Identifies the calling service for the `sub` claim (e.g.
  // "task-router", "agent-presence") -- diagnostics/audit only, not part
  // of the trust decision itself (the shared_secret is).
  string caller_service = 2;
  // The shared service credential, sourced from the same Kubernetes
  // Secret (ccaas-service-credential) on both the caller and this
  // service. Deliberately NOT a per-service username/password -- see this
  // RPC's file-level doc comment for the explicit scoping rationale.
  string shared_secret = 3;
}

message IssueServiceTokenResponse {
  // Signed, short-lived JWT -- same shape as LoginResponse.token.
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}
