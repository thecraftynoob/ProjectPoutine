apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-presence-deployment
  namespace: ccaas-dev
  labels:
    app: agent-presence
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-presence
  template:
    metadata:
      labels:
        app: agent-presence
    spec:
      containers:
        - name: agent-presence
          image: ccaas/agent-presence:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50055
              name: grpc
            - containerPort: 8085
              name: ws
          env:
            - name: AGENT_PRESENCE_GRPC_PORT
              value: "50055"
            - name: AGENT_PRESENCE_WS_ADDR
              value: ":8085"
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: REDIS_ADDR
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: NATS_URL
            # JWT_PUBLIC_KEY_PATH: see the tenant-identity-public-key
            # ConfigMap volume/volumeMount below -- read at startup via
            # pkg/jwtauth.LoadVerifierFromFile, shared by this service's
            # gRPC interceptor and its /ws Authorization header check
            # (internal/wsserver).
            - name: JWT_PUBLIC_KEY_PATH
              value: "/etc/ccaas/jwt/public_key.pem"
            # WS_TICKET_PUBLIC_KEY_PATH: see the
            # api-gateway-ws-ticket-public-key ConfigMap volume/
            # volumeMount below -- enables /ws's ?ticket= auth path for
            # browser Agent Desktop clients proxied through API Gateway
            # (internal/wsserver's doc comment). Deliberately optional --
            # see api-gateway-ws-ticket-public-key.example.yaml's
            # "CONSUMED BY" note: an unconfigured/missing key here only
            # disables the ticket path, the Authorization header path
            # keeps working unaffected.
            - name: WS_TICKET_PUBLIC_KEY_PATH
              value: "/etc/ccaas/ws-ticket-jwt/public_key.pem"
            # SERVICE_SHARED_SECRET: the shared credential this service
            # supplies to Tenant & Identity's IssueServiceToken RPC --
            # see deploy/k8s/service-credential.example.yaml.
            - name: SERVICE_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: ccaas-service-credential
                  key: SERVICE_SHARED_SECRET
            # TENANT_IDENTITY_GRPC_ADDR: where this service reaches
            # Tenant & Identity's gRPC server to call IssueServiceToken.
            - name: TENANT_IDENTITY_GRPC_ADDR
              value: "tenant-identity-svc:50051"
          volumeMounts:
            - name: tenant-identity-public-key
              mountPath: /etc/ccaas/jwt
              readOnly: true
            - name: api-gateway-ws-ticket-public-key
              mountPath: /etc/ccaas/ws-ticket-jwt
              readOnly: true
          livenessProbe:
            exec:
              command: ["grpc_health_probe", "-addr=:50055"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["grpc_health_probe", "-addr=:50055"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tenant-identity-public-key
          configMap:
            name: tenant-identity-public-key
        # optional: true -- this ConfigMap may not exist yet (e.g. before
        # API Gateway has been deployed/started once to generate and log
        # its ws-ticket public key -- see that ConfigMap's example file).
        # A missing ConfigMap then mounts an empty directory rather than
        # blocking this pod from scheduling; WSTicketPublicKeyPath being
        # unreadable at that path is handled as "ticket path disabled"
        # by cmd/main.go, not a startup failure -- see its doc comment.
        - name: api-gateway-ws-ticket-public-key
          configMap:
            name: api-gateway-ws-ticket-public-key
            optional: true
