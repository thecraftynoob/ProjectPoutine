# Example Secret manifest for the shared service-to-service credential
# consumed by Tenant & Identity Management's IssueServiceToken RPC (see
# proto/tenant-identity/v1/tenant_identity.proto and
# services/tenant-identity/internal/grpcapi/identity.go).
#
# SCOPING NOTE (important -- read before treating this as more than it
# is): this is a single shared secret every service in the cluster reads
# from the SAME Kubernetes Secret. It authenticates "some service in this
# cluster is calling IssueServiceToken," not "specifically task-router is
# calling IssueServiceToken" -- there is no per-service identity or
# credential rotation here. This is a deliberate, narrow, minimally-scoped
# mechanism to retire the earlier blind-trust-of-x-tenant-id placeholder
# and establish the real bearer-token pattern end-to-end -- it is
# explicitly NOT a hardened mTLS/zero-trust service mesh (see
# CCAAS_ENTERPRISE_ARCHITECTURE.md Section 1.1 Layer 2's "separately
# authenticated via mTLS + a distinct admin scope" language, which a real
# service mesh would satisfy and this does not attempt to). A future
# milestone that wants per-service identity (e.g. SPIFFE/SPIRE, mTLS
# client certs, or per-service secrets) would replace this Secret's
# consumption pattern without changing IssueServiceToken's basic RPC
# shape.
#
# Distribution mirrors deploy/k8s/infra-secret.example.yaml exactly: NOT
# applied automatically and NOT meant to be committed with a real value --
# copy this file, fill in a real random secret, and apply it yourself:
#
#   kubectl apply -f deploy/k8s/service-credential.local.yaml
#
# (service-credential.local.yaml is git-ignored -- see .gitignore.) A real
# deployment replaces this Secret's source with a real secrets manager
# (Vault / cloud KMS) via the same Kubernetes Secret interface, per
# architecture doc Section 1.4 -- no application code change either way.
#
# Consumed by:
#   - tenant-identity (as TENANT_IDENTITY_SERVICE_SHARED_SECRET): the
#     value IssueServiceToken checks callers against.
#   - Every service that calls IssueServiceToken to obtain a service-to-
#     service token (as SERVICE_SHARED_SECRET): the value it supplies on
#     that call. Today that's task-router and agent-presence, wired for
#     this milestone's live verification -- see each service's
#     deployment.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: ccaas-service-credential
  namespace: ccaas-dev
type: Opaque
stringData:
  SERVICE_SHARED_SECRET: "ccaas_dev_service_shared_secret"
