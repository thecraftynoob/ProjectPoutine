apiVersion: apps/v1
kind: Deployment
metadata:
  name: background-worker-pool-deployment
  namespace: ccaas-dev
  labels:
    app: background-worker-pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: background-worker-pool
  template:
    metadata:
      labels:
        app: background-worker-pool
    spec:
      containers:
        - name: background-worker-pool
          image: ccaas/background-worker-pool:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50058
              name: grpc
          env:
            - name: BACKGROUND_WORKER_POOL_GRPC_PORT
              value: "50058"
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: NATS_URL
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ccaas-infra-secret
                  key: POSTGRES_PASSWORD
            # POSTGRES_DSN is what services/background-worker-pool/cmd/main.go
            # actually reads (env:"POSTGRES_DSN,required"); composed here via
            # Kubernetes' $(VAR) env-var interpolation from the discrete parts
            # above, matching task-router's/historical-reporting's
            # deployment.yaml pattern exactly rather than duplicating the
            # whole DSN as its own ConfigMap entry.
            - name: POSTGRES_DSN
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=disable"
            # JWT_PUBLIC_KEY_PATH: see the tenant-identity-public-key
            # ConfigMap volume/volumeMount below -- required for
            # pkg/tenantctx's interceptor to verify any caller's bearer
            # token (fails closed / refuses to start without it).
            - name: JWT_PUBLIC_KEY_PATH
              value: "/etc/ccaas/jwt/public_key.pem"
          volumeMounts:
            - name: tenant-identity-public-key
              mountPath: /etc/ccaas/jwt
              readOnly: true
          livenessProbe:
            exec:
              command: ["grpc_health_probe", "-addr=:50058"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["grpc_health_probe", "-addr=:50058"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tenant-identity-public-key
          configMap:
            name: tenant-identity-public-key
