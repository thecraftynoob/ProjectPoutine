# Example Secret manifest for the docker-compose Postgres password(s) used
# by local dev (see .env.local.example / docker-compose.yml's
# POSTGRES_PASSWORD default). NOT applied automatically and NOT meant to be
# committed with a real value -- copy this file, fill in the actual
# password(s) your local docker-compose.yml is using, and apply it
# yourself:
#
#   kubectl apply -f deploy/k8s/infra-secret.local.yaml
#
# (infra-secret.local.yaml is git-ignored -- see .gitignore.) A real
# deployment replaces this Secret's source entirely (Vault / cloud KMS via
# the same Kubernetes Secret interface), per architecture doc Section 1.4 --
# no application code changes either way.
#
# TWO Postgres passwords, matching infra-config.yaml's two connection
# identities (2026-09-14 fix -- see ARCHITECTURE_FLOW.md §5 and GAPS.md's
# "Closed gaps" section):
#   - POSTGRES_PASSWORD: the superuser ("ccaas") password -- unchanged,
#     pre-existing key. Every service's Migrate() uses it ONLY at startup
#     for schema migrations and to provision/grant the runtime role below.
#   - POSTGRES_RUNTIME_PASSWORD: the shared runtime role's ("ccaas_app",
#     see infra-config.yaml's POSTGRES_RUNTIME_USER) password. Every
#     service's steady-state, ongoing Postgres queries authenticate with
#     this password instead of the superuser's -- the fix for Postgres
#     superusers unconditionally bypassing Row-Level Security regardless
#     of FORCE ROW LEVEL SECURITY, which had silently made every RLS
#     policy in this repo a no-op against real traffic. Consumed identically
#     by every service's runtime_role.go (e.g.
#     services/tenant-identity/internal/pgstore/runtime_role.go) to
#     provision the role with a MATCHING password via CREATE ROLE ...
#     PASSWORD, and by every deployment.yaml to compose
#     RUNTIME_POSTGRES_DSN -- one fixed, shared password across every
#     service, provisioned the same way POSTGRES_PASSWORD already is. This
#     is a deliberate, documented dev/POC-scale simplification (see
#     GAPS.md's "Security & auth" section for the corresponding gap entry
#     this fix adds) -- NOT a production-hardened per-service credential
#     scheme; consistent with this repo's existing
#     service-credential.example.yaml precedent for
#     SERVICE_SHARED_SECRET.
apiVersion: v1
kind: Secret
metadata:
  name: ccaas-infra-secret
  namespace: ccaas-dev
type: Opaque
stringData:
  POSTGRES_PASSWORD: "ccaas_dev_password"
  POSTGRES_RUNTIME_PASSWORD: "ccaas_app_dev_password"
