apiVersion: apps/v1
kind: Deployment
metadata:
  name: historical-reporting-deployment
  namespace: ccaas-dev
  labels:
    app: historical-reporting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: historical-reporting
  template:
    metadata:
      labels:
        app: historical-reporting
    spec:
      containers:
        - name: historical-reporting
          image: ccaas/historical-reporting:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50057
              name: grpc
          env:
            - name: HISTORICAL_REPORTING_GRPC_PORT
              value: "50057"
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: NATS_URL
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: POSTGRES_USER
            - name: POSTGRES_RUNTIME_USER
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: POSTGRES_RUNTIME_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ccaas-infra-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_RUNTIME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ccaas-infra-secret
                  key: POSTGRES_RUNTIME_PASSWORD
            # POSTGRES_DSN is the SUPERUSER connection
            # services/historical-reporting/cmd/main.go reads
            # (env:"POSTGRES_DSN,required") to run pgstore.Migrate at
            # startup ONLY (CREATE ROLE/GRANT require superuser or
            # table-owner privilege) -- composed here via Kubernetes'
            # $(VAR) env-var interpolation from the discrete parts above,
            # matching task-router's/tenant-identity's deployment.yaml
            # pattern exactly rather than duplicating the whole DSN as its
            # own ConfigMap entry.
            - name: POSTGRES_DSN
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=disable"
            # RUNTIME_POSTGRES_DSN is the non-superuser, NOBYPASSRLS
            # pgstore.RuntimeRole connection
            # services/historical-reporting/cmd/main.go reads
            # (env:"RUNTIME_POSTGRES_DSN,required") for this service's
            # REAL, ongoing writes into historical_events -- see
            # ARCHITECTURE_FLOW.md §5 and GAPS.md's "Closed gaps" section
            # for the platform-wide connection-identity fix this is part
            # of. Composed the same $(VAR) way as POSTGRES_DSN above, just
            # from the runtime-role parts.
            - name: RUNTIME_POSTGRES_DSN
              value: "postgres://$(POSTGRES_RUNTIME_USER):$(POSTGRES_RUNTIME_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=disable"
            # JWT_PUBLIC_KEY_PATH: see the tenant-identity-public-key
            # ConfigMap volume/volumeMount below -- required for
            # pkg/tenantctx's interceptor to verify any caller's bearer
            # token (fails closed / refuses to start without it).
            - name: JWT_PUBLIC_KEY_PATH
              value: "/etc/ccaas/jwt/public_key.pem"
          volumeMounts:
            - name: tenant-identity-public-key
              mountPath: /etc/ccaas/jwt
              readOnly: true
          livenessProbe:
            exec:
              command: ["grpc_health_probe", "-addr=:50057"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["grpc_health_probe", "-addr=:50057"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tenant-identity-public-key
          configMap:
            name: tenant-identity-public-key
