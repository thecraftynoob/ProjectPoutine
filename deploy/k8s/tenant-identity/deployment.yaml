apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-identity-deployment
  namespace: ccaas-dev
  labels:
    app: tenant-identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenant-identity
  template:
    metadata:
      labels:
        app: tenant-identity
    spec:
      containers:
        - name: tenant-identity
          image: ccaas/tenant-identity:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc
          env:
            - name: TENANT_IDENTITY_GRPC_PORT
              value: "50051"
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ccaas-infra-secret
                  key: POSTGRES_PASSWORD
            # POSTGRES_DSN is what services/tenant-identity/cmd/main.go
            # actually reads (env:"POSTGRES_DSN,required"); composed here
            # via Kubernetes' $(VAR) env-var interpolation from the
            # discrete parts above, mirroring task-router's deployment.yaml
            # exactly rather than duplicating the whole DSN as its own
            # ConfigMap entry.
            - name: POSTGRES_DSN
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=disable"
          livenessProbe:
            exec:
              command: ["grpc_health_probe", "-addr=:50051"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["grpc_health_probe", "-addr=:50051"]
            initialDelaySeconds: 5
            periodSeconds: 10
