apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-identity-deployment
  namespace: ccaas-dev
  labels:
    app: tenant-identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenant-identity
  template:
    metadata:
      labels:
        app: tenant-identity
    spec:
      containers:
        - name: tenant-identity
          image: ccaas/tenant-identity:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc
          env:
            - name: TENANT_IDENTITY_GRPC_PORT
              value: "50051"
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: POSTGRES_USER
            - name: POSTGRES_RUNTIME_USER
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: POSTGRES_RUNTIME_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: ccaas-infra-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ccaas-infra-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_RUNTIME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ccaas-infra-secret
                  key: POSTGRES_RUNTIME_PASSWORD
            # POSTGRES_DSN is the SUPERUSER connection
            # services/tenant-identity/cmd/main.go reads
            # (env:"POSTGRES_DSN,required") to run pgstore.Migrate at
            # startup ONLY (CREATE ROLE/GRANT require superuser or
            # table-owner privilege) -- composed here via Kubernetes'
            # $(VAR) env-var interpolation from the discrete parts above,
            # mirroring task-router's deployment.yaml exactly rather than
            # duplicating the whole DSN as its own ConfigMap entry.
            - name: POSTGRES_DSN
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=disable"
            # RUNTIME_POSTGRES_DSN is the non-superuser, NOBYPASSRLS
            # pgstore.RuntimeRole connection
            # services/tenant-identity/cmd/main.go reads
            # (env:"RUNTIME_POSTGRES_DSN,required") for this service's
            # REAL, ongoing queries, including against the RLS-protected
            # tenant_identity_users table -- so Row-Level Security is
            # genuinely enforced instead of silently bypassed by a
            # superuser connection (confirmed live: ListUsers previously
            # returned every tenant's users, not just the caller's -- see
            # ARCHITECTURE_FLOW.md §5 and GAPS.md's "Closed gaps" section
            # for the full writeup). Composed the same $(VAR) way as
            # POSTGRES_DSN above, just from the runtime-role parts.
            - name: RUNTIME_POSTGRES_DSN
              value: "postgres://$(POSTGRES_RUNTIME_USER):$(POSTGRES_RUNTIME_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=disable"
            # TENANT_IDENTITY_SERVICE_SHARED_SECRET: the credential
            # IssueServiceToken checks every caller against -- see
            # deploy/k8s/service-credential.example.yaml for the full
            # scoping rationale (a narrow, documented stand-in for a real
            # per-service identity scheme, not a hardened mTLS mesh).
            - name: TENANT_IDENTITY_SERVICE_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: ccaas-service-credential
                  key: SERVICE_SHARED_SECRET
          livenessProbe:
            exec:
              command: ["grpc_health_probe", "-addr=:50051"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["grpc_health_probe", "-addr=:50051"]
            initialDelaySeconds: 5
            periodSeconds: 10
