# Example ConfigMap for distributing Tenant & Identity Management's JWT
# signing PUBLIC key to other services in the cluster.
#
# services/tenant-identity generates (once, on first-ever startup) an
# ECDSA P-256 signing keypair, persists the PRIVATE key in Postgres (see
# services/tenant-identity/internal/pgstore/migrations/003_signing_keypair.sql),
# and logs the PEM-encoded PUBLIC key prominently on every startup (see
# cmd/main.go). That public key is what any service needs to verify tokens
# tenant-identity issues, via pkg/jwtauth.NewVerifier -- and nothing more,
# since pkg/jwtauth has zero dependency on Postgres/Redis/NATS.
#
# Distribution today is a MANUAL operator step, deliberately, for this
# milestone: copy the PEM block from tenant-identity's startup logs
# (`kubectl logs -n ccaas-dev deploy/tenant-identity-deployment | grep -A20
# "SIGNING PUBLIC KEY"`) into the placeholder below, then:
#
#   kubectl apply -f deploy/k8s/tenant-identity-public-key.local.yaml
#
# (copy this file to tenant-identity-public-key.local.yaml first -- that
# name is git-ignored, see .gitignore -- so a real deployment's public key
# is never committed here as a fake "example"). NOT applied automatically.
#
# OBSERVED CAVEAT (this milestone's live verification): on this
# environment's Docker Desktop Kubernetes, `kubectl logs` for this
# deployment's pod was observed to sometimes only surface the LAST log
# line written before the gRPC server starts serving (the startup-banner
# lines logged just before it were missing from `kubectl logs` output,
# even with --timestamps and no tail limit) -- a log-capture quirk of
# that specific local cluster, not a bug in this service's logging code
# (confirmed: `docker run` on the same image against the same Postgres
# instance reliably prints all four banner lines). If `kubectl logs`
# appears to be missing the banner, a reliable fallback is running the
# same image directly against the same POSTGRES_DSN via `docker run`
# (LoadOrGenerate loads the already-persisted key rather than generating
# a new one, so this prints the SAME key the cluster pod is actually
# using) -- see this milestone's report for the exact command used.
#
# CONSUMED BY: every service in this repo except tenant-identity itself
# (which verifies its own tokens using the in-process private key it
# already holds -- see services/tenant-identity/cmd/main.go) and
# api-gateway (which does not run pkg/tenantctx's interceptor at all,
# since it is the edge that ORIGINATES tenant context from a validated
# JWT rather than validating one from an internal caller -- see
# architecture doc Section 1.1 Layer 1 vs Layer 2). Every other service's
# deployment.yaml mounts this ConfigMap as a file (see each service's
# deployment.yaml's `tenant-identity-public-key` volume/volumeMount) at
# /etc/ccaas/jwt/public_key.pem, read at startup via
# pkg/jwtauth.LoadVerifierFromFile and passed to
# pkg/tenantctx.UnaryServerInterceptor/StreamServerInterceptor. A service
# that cannot load a valid key refuses to start (fail closed on a
# security control) rather than silently accepting unauthenticated
# traffic.
#
# Key rotation is out of scope for this milestone (see
# migrations/003_signing_keypair.sql): replacing this ConfigMap's value
# with a NEW public key, without a corresponding rollout coordinated across
# every verifying service, would invalidate every token signed under the
# key those services still expect -- a real rotation scheme (e.g.
# publishing multiple valid keys with key IDs) is deferred future work.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-identity-public-key
  namespace: ccaas-dev
data:
  # Replace with the PEM block logged by tenant-identity at startup
  # (BEGIN/END PUBLIC KEY, SubjectPublicKeyInfo / PKIX DER, ECDSA P-256).
  # This placeholder is NOT a real key and will not verify anything.
  public_key.pem: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_TENANT_IDENTITY_STARTUP_LOG_PUBLIC_KEY_PEM
    -----END PUBLIC KEY-----
