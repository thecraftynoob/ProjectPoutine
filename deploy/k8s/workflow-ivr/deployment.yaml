apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-ivr-deployment
  namespace: ccaas-dev
  labels:
    app: workflow-ivr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow-ivr
  template:
    metadata:
      labels:
        app: workflow-ivr
    spec:
      containers:
        - name: workflow-ivr
          image: ccaas/workflow-ivr:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50056
              name: grpc
          env:
            - name: WORKFLOW_IVR_GRPC_PORT
              value: "50056"
            # JWT_PUBLIC_KEY_PATH: see the tenant-identity-public-key
            # ConfigMap volume/volumeMount below -- required for
            # pkg/tenantctx's interceptor to verify any caller's bearer
            # token (fails closed / refuses to start without it).
            - name: JWT_PUBLIC_KEY_PATH
              value: "/etc/ccaas/jwt/public_key.pem"
          volumeMounts:
            - name: tenant-identity-public-key
              mountPath: /etc/ccaas/jwt
              readOnly: true
          livenessProbe:
            exec:
              command: ["grpc_health_probe", "-addr=:50056"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["grpc_health_probe", "-addr=:50056"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tenant-identity-public-key
          configMap:
            name: tenant-identity-public-key
